<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">

  <defs>
    <!-- Background Liquid Gradient -->
    <radialGradient id="bgLiquidDark" cx="30%" cy="20%" r="100%">
      <stop offset="0%" stop-color="#1A2332"/>
      <stop offset="60%" stop-color="#121820"/>
      <stop offset="100%" stop-color="#0C1018"/>
    </radialGradient>

    <!-- Inner Diffusion -->
    <radialGradient id="innerDiffuseDark" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <!-- Note Gradient -->
    <linearGradient id="noteGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B9AFF"/>
      <stop offset="100%" stop-color="#A78BDB"/>
    </linearGradient>

    <!-- Depth Shadow -->
    <filter id="depthShadowDark" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="25"/>
      <feOffset dy="25"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Blur -->
    <filter id="glassBlurDark">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- FULL BLEED BACKGROUND (critical fix) -->
  <rect x="0" y="0" width="1024" height="1024" rx="225"
        fill="url(#bgLiquidDark)"/>

  <!-- Inner Glass Plate (balanced spacing) -->
  <rect x="90" y="90" width="844" height="844" rx="205"
        fill="white"
        fill-opacity="0.08"
        stroke="white"
        stroke-opacity="0.22"
        stroke-width="2"/>

  <!-- Light Bloom -->
  <ellipse cx="430" cy="330" rx="340" ry="200"
           fill="url(#innerDiffuseDark)"
           opacity="0.75"
           filter="url(#glassBlurDark)"/>

  <!-- Subtle Top Reflection -->
  <path d="M240,0 Q512,160 784,0"
        stroke="white"
        stroke-opacity="0.22"
        stroke-width="5"
        fill="none"
        stroke-linecap="round"/>

  <!-- Specular Highlights -->
  <circle cx="300" cy="300" r="65"
          fill="white"
          opacity="0.16"
          filter="url(#glassBlurDark)"/>

  <ellipse cx="760" cy="760" rx="120" ry="80"
           fill="white"
           opacity="0.10"
           transform="rotate(-35 760 760)"
           filter="url(#glassBlurDark)"/>

  <!-- OPTICALLY CENTERED NOTE -->
  <g transform="translate(575,525)">
    <g transform="scale(2.35)">

      <!-- Shadow -->
      <path d="M-70,-110 L-70,10 
               Q-70,55 -120,55 
               Q-170,55 -170,10 
               Q-170,-35 -120,-35 
               L-40,-35 L-40,-150 
               L100,-105 L100,70 
               Q100,120 50,120 
               Q0,120 0,70 
               Q0,25 50,25 
               L70,25 L70,-70 Z"
            fill="#8B9AFF"
            opacity="0.12"
            transform="translate(14,20)"
            filter="url(#depthShadowDark)"/>

      <!-- Main Note -->
      <path d="M-70,-110 L-70,10 
               Q-70,55 -120,55 
               Q-170,55 -170,10 
               Q-170,-35 -120,-35 
               L-40,-35 L-40,-150 
               L100,-105 L100,70 
               Q100,120 50,120 
               Q0,120 0,70 
               Q0,25 50,25 
               L70,25 L70,-70 Z"
            fill="url(#noteGradientDark)"/>

      <!-- Glass Highlight -->
      <path d="M-60,-100 L-60,5 
               Q-60,40 -110,40 
               Q-150,40 -150,5 
               Q-150,-25 -110,-25 
               L-45,-25 L-45,-135 
               L85,-95 L85,60 
               Q85,95 50,95 
               Q15,95 15,60 
               Q15,35 50,35 
               L60,35 L60,-60 Z"
            fill="white"
            opacity="0.20"/>

    </g>
  </g>

</svg>
